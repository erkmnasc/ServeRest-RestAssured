name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # toda segunda-feira, 8h (horário de Brasília): avisa se algo quebrar sem mudança no código
    - cron: "0 11 * * 1"

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    # Backend ServeRest em container, na mesma versão usada localmente
    services:
      serverest:
        image: paulogoncalvesbh/serverest:3.5.0
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Aguardar o backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/usuarios > /dev/null && exit 0
            sleep 2
          done
          echo "ServeRest não respondeu" && exit 1

      - name: Testes
        run: mvn -B test
        env:
          API_URL: http://localhost:3000

      # Tabela com o resultado de cada teste na página da execução
      - name: Resumo dos testes
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            target/cucumber-report.html
            target/surefire-reports/
          if-no-files-found: ignore
